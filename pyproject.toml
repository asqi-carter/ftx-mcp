[project]
name = "ftx-mcp"
dynamic = ["version"]
description = "MCP server for authoring, previewing, and verifying FactoryTalk Optix Studio changes via the emulator, single Windows box."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [
    { name = "ASQI" },
]
keywords = ["factorytalk", "optix", "mcp", "rockwell", "ot"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Installation/Setup",
]
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.5",
    "uvicorn>=0.27",
    "mcp>=1.2,<2",
    # Directly imported at module scope in service/mcp_app.py (anyio.to_thread).
    # Reaches the venv transitively via mcp + starlette today, but a direct
    # import warrants its own constraint so a downstream version shift can't
    # silently break it.
    "anyio>=4",
    "psutil>=5.9",
    "websocket-client>=1.7",
    # Pixel diff (optix_cdp_diff) and native-engine screenshots
    # (optix_observe target="native") need it; a pip install must work out of
    # the box, so it is a hard dependency (imports stay lazy in the code).
    "Pillow>=10",
    # Offline structural validator (service/optix_validate.py, U17) safe_loads
    # the Nodes/**/*.yaml source tree; Linux/CI-buildable, no Studio required.
    "pyyaml>=6",
    # Windows-only: the per-window UIA read of Studio's live deploy target
    # (service/studio_uia.py) used by the F5 guard / optix_active_target.
    # sys_platform marker keeps Linux dev/CI clean (studio_uia lazy-imports
    # and degrades to the config-file fallback when absent).
    "uiautomation>=2.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
]
# Kept empty for compatibility: Pillow moved into [project.dependencies], so
# `pip install ftx-mcp[visual]` (older docs, bootstrap scripts) still resolves.
visual = []

[project.scripts]
ftx-mcp = "service.main:main"
ftx-mcp-validate = "service._validate_cli:main"

[project.urls]
Homepage = "https://github.com/asqi-carter/ftx-mcp"
Issues = "https://github.com/asqi-carter/ftx-mcp/issues"
Specification = "https://github.com/asqi-carter/ftx-mcp/blob/main/docs/architecture.md"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["service"]

[tool.setuptools.package-data]
# static/ = the /ui dashboard; _bundled/ is filled at build time by setup.py
# (skills + bridge source) and is absent from the checkout.
service = ["static/*", "_bundled/**/*"]

[tool.setuptools.dynamic]
# Single source of truth for the service version: service/__init__.py.
version = { attr = "service.__version__" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = [
    "E501",  # let formatter handle line length
]

[tool.ruff.lint.per-file-ignores]
"service/tests/*" = ["S101"]  # asserts in tests are fine
"service/core.py" = ["N818", "N806"]  # domain exception names + Win32 constant naming
"service/deploy_lock.py" = ["N818", "N806"]  # LockHeld + Win32 constant naming
"service/mcp_app.py" = ["N818", "N806"]  # ScopeInsufficient exception + dispatch constant

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true  # mcp / asyncua may lack stubs

[tool.pytest.ini_options]
testpaths = ["service/tests"]
addopts = "-ra"
asyncio_mode = "strict"
markers = [
    "live: tests that drive a real Studio / bridge; the unit-suite NetLogic template-wait speed-up (conftest) is not applied",
    "real_project_resolution: run/restart/status tests that need the real project_not_found refusal (the conftest default resolves any name)",
    "real_studio_attribution: run_emulator tests that exercise the real Studio-to-project attribution instead of the pinned fake pid",
    "slow_live: slow live-bridge tests (NetLogic race / re-create, 57-81 s each); excluded from the default live run with -m \"not slow_live\", run separately with -m slow_live",
]
